<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <title>Formulario de Usuario</title>
</head>
<body>
    <form action="/usuarios/actualizar/{{usuario['id']}}" method="post" class="p-3 col-4 mx-auto my-5 border">
        <h2 class="text-center text-primary">Editar usuario {{usuario['id']}}:</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
            <div class="alert alert-danger" role="alert">
                <strong>Mensajes FLASH AHHHHHHH!!!!</strong>
                    {% for message in messages %}
                    <p>{{message}}</p>
                    {% endfor %}
            </div>
            {% endif %}
        {% endwith %}
        <div class="form-group">
            <label for="name">Nombre:</label>
            <input type="text" name="nombre" id="nombre" class="form-control" value="{{usuario['nombre']}}">
        </div>
        <div class="form-group">
            <label for="apellido">Apellido:</label>
            <input type="text" name="apellido" id="apellido" class="form-control" value="{{usuario['apellido']}}">
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" class="form-control" value="{{usuario['email']}}">
        </div>

        <input type="submit" value="Actualizar Usuario" class="btn btn-primary btn-outline-dark">
    </form>
</body>
</html>
